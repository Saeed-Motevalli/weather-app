<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" overflow="visible">
  <defs>
    <linearGradient id="moon-fill" x1="30" y1="24" x2="108" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F7FF"/>
      <stop offset="1" stop-color="#8CAAF2"/>
    </linearGradient>
    <!-- A mask keeps the crescent edge crisp in every browser/WebView. -->
    <mask id="crescent-mask" maskUnits="userSpaceOnUse" mask-type="luminance">
      <rect width="160" height="160" fill="white"/>
      <circle cx="98" cy="61" r="52" fill="black"/>
    </mask>
  </defs>

  <!-- Crescent moon: the right/up circle cuts the outer circle cleanly. -->
  <circle cx="69" cy="81" r="56" fill="url(#moon-fill)" mask="url(#crescent-mask)"/>
  <circle cx="34" cy="43" r="4" fill="#DDEAFF"/>
  <circle cx="121" cy="32" r="5" fill="#FFE8A4"/>
  <circle cx="128" cy="88" r="3" fill="#DDEAFF"/>
</svg>
